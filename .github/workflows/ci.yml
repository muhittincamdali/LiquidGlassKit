name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -scheme LiquidGlassKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
      - name: Build demo app
        run: |
          xcodebuild build \
            -project Examples/LiquidGlassDemo/LiquidGlassDemo.xcodeproj \
            -scheme LiquidGlassDemo \
            -destination "generic/platform=iOS Simulator"

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build
        run: |
          xcodebuild build \
            -scheme LiquidGlassKit \
            -destination "generic/platform=${{ matrix.platform }} Simulator"
