name: Feature request
description: Suggest a component or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to build, and what is missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: A sketch of how you would like to call it.
      render: swift

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
