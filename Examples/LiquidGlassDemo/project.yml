# Regenerate the Xcode project with: xcodegen generate --spec project.yml
name: LiquidGlassDemo
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
packages:
  LiquidGlassKit:
    path: ../..
targets:
  LiquidGlassDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: LiquidGlassKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.LiquidGlassDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiquidGlass
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}
