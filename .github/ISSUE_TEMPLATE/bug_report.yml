name: Bug report
description: Something renders or behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw and what you expected instead. Screenshots help for visual issues.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      render: swift
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - glassSurface / GlassGroup
        - GlassButton / LiquidGlassButtonStyle
        - GlassCard
        - GlassTextField
        - GlassSearchBar
        - GlassTabBar
        - GlassNavigationBar
        - GlassSheet
        - GlassTheme / GlassRenderingMode
        - Other

  - type: dropdown
    id: path
    attributes:
      label: Rendering path
      options:
        - Native (OS 26 or later)
        - Fallback (earlier OS, visionOS, or forced)
        - Not sure

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "iOS 18.4 simulator, Xcode 26.1, LiquidGlassKit 1.1.0"
    validations:
      required: true
